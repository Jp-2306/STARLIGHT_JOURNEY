<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starlight Journey</title>
<link rel="icon" href="img/cohete-recto.webp">
<link rel="stylesheet" href="css/estilos.css">
<script type="importmap">
{ "imports": { "three": "./libs/three.module.js", "three/addons/": "./libs/addons/" } }
</script>
</head>
<body class="menu-cerrado">

<!-- ====================== HEADER ====================== -->
<header id="cabecera">
  <button id="btn-menu" aria-label="Menu">☰</button>
  <div class="marca">
    <strong id="titulo">Starlight Journey</strong>
    <span id="subtitulo"></span>
  </div>
  <nav class="pestanas">
    <button class="tab" data-tab="proposito" aria-expanded="false"><span aria-hidden="true">🎯</span><span class="lbl" data-i18n="tabProposito"></span></button>
    <button class="tab" data-tab="nosotros" aria-expanded="false"><span aria-hidden="true">👥</span><span class="lbl" data-i18n="tabNosotros"></span></button>
  </nav>
  <button id="btn-sonido" class="redondo">🔊</button>
  <button id="btn-idioma" class="redondo"><b data-lang="en">EN</b><i>|</i><b data-lang="es">ES</b></button>
  <div class="marcador" aria-live="polite">
    <span class="insignias" id="insignias">0/5 🚀</span>
    <span class="puntos" id="puntos">⭐ 0</span>
  </div>
  <!-- Pestaña desplegable (Propósito / Quiénes somos) -->
  <div id="desplegable" hidden>
    <button id="desplegable-cerrar" aria-label="Close">✕</button>
    <div id="desplegable-cuerpo"></div>
  </div>
</header>

<div id="cuerpo">
  <!-- ====================== BARRA LATERAL ====================== -->
  <aside id="menu">
    <h2 data-i18n="indice"></h2>
    <nav id="indice"></nav>
    <p id="creditos" data-i18n="avisoIACorto"></p>
    <button id="btn-reiniciar" class="suave" data-i18n="reiniciar"></button>
  </aside>
  <div id="velo"></div>

  <!-- ====================== CONTENIDO ====================== -->
  <main id="escenario">

    <!-- Escena 1: el espacio -->
    <section id="espacio" class="capa activa">
      <button class="planeta" id="p-tierra" data-ir="tierra">
        <img src="img/tierra.webp" alt=""><span data-i18n="tierra"></span>
      </button>
      <button class="planeta" id="p-luna" data-ir="luna">
        <img src="img/luna.webp" alt=""><span id="lbl-luna"></span>
      </button>
      <button class="planeta" id="p-marte" data-ir="marte">
        <img src="img/marte.webp" alt=""><span id="lbl-marte"></span>
      </button>
      <img id="cohete" src="img/cohete-recto.webp" alt="">
      <div id="globo"></div>
    </section>

    <!-- Escena 2: un mundo (Luna o Marte) con sus modelos 3D -->
    <section id="mundo" class="capa">
      <div id="fondo-mundo"></div>
      <div id="visor">
        <canvas id="lienzo"></canvas>
        <div id="etiquetas"></div>
        <div id="cargando" hidden><div class="aro"></div><span id="cargando-txt"></span></div>
        <div class="barra-nav">
          <button id="btn-volver" class="boton-nav"></button>
          <button id="btn-historia" class="boton-nav" data-i18n="historia"></button>
        </div>
        <h1 id="nombre-mundo"></h1>
        <div id="voz-sub" hidden></div>
        <div id="pista" hidden data-i18n="pista"></div>
        <div id="controles" hidden>
          <label for="desarmar" data-i18n="armar"></label>
          <input id="desarmar" type="range" min="0" max="100" value="0">
          <span data-i18n="desarmar"></span>
          <button id="btn-girar" class="chip" aria-pressed="true" data-i18n="giro"></button>
        </div>
      </div>

      <!-- Panel de información de la estación -->
      <aside id="panel" hidden>
        <div id="vineta" hidden>
          <small data-i18n="pieza"></small>
          <strong id="vineta-nombre"></strong>
          <p id="vineta-para"></p>
          <p id="vineta-detalle" hidden></p>
        </div>
        <div class="ficha">
          <span class="anio" id="f-anio"></span>
          <button id="f-voz" class="chip" hidden>🔊 <span data-i18n="escuchar"></span></button>
          <h2 id="f-nombre"></h2>
          <p class="resumen" id="f-resumen"></p>
          <h3 data-i18n="que"></h3>
          <p id="f-que"></p>
          <h3 data-i18n="porque"></h3>
          <p id="f-porque"></p>
          <h3 data-i18n="descubrimientos"></h3>
          <ul id="f-desc"></ul>
          <h3><span data-i18n="piezas"></span> <span id="f-conteo"></span></h3>
          <div id="f-piezas" class="chips"></div>
          <div id="f-secreto"></div>
        </div>
      </aside>
    </section>

    <!-- Pantallas de historia: inicio, llegada a la Luna, viaje a Marte y final -->
    <section id="relato" hidden>
      <div id="relato-img"></div>
      <div class="relato-caja">
        <h1 id="relato-titulo"></h1>
        <p id="relato-lema" hidden></p>
        <p id="relato-texto" hidden></p>
        <p id="relato-pista" hidden></p>
        <div id="relato-stats" hidden></div>
        <div id="relato-botones"></div>
      </div>
    </section>

    <div id="aviso"></div>
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
