<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exploradores del Espacio</title>
<link rel="icon" href="img/cohete-recto.webp">
<link rel="stylesheet" href="css/estilos.css">
<script type="importmap">
{ "imports": { "three": "./libs/three.module.js", "three/addons/": "./libs/addons/" } }
</script>
</head>
<body class="menu-cerrado">

<!-- ====================== HEADER ====================== -->
<header id="cabecera">
  <button id="btn-menu" aria-label="Abrir o cerrar el índice">☰</button>
  <div class="marca">
    <strong id="titulo">Exploradores del Espacio</strong>
    <span id="subtitulo"></span>
  </div>
  <div class="marcador" aria-live="polite">
    <span class="insignias" id="insignias" title="Misiones completadas">0/5 🚀</span>
    <span class="puntos" id="puntos">⭐ 0</span>
  </div>
</header>

<div id="cuerpo">
  <!-- ====================== BARRA LATERAL ====================== -->
  <aside id="menu" aria-label="Índice del contenido">
    <h2>Índice</h2>
    <nav id="indice"></nav>
    <button id="btn-reiniciar" class="suave">Reiniciar progreso</button>
  </aside>
  <div id="velo"></div>

  <!-- ====================== CONTENIDO ====================== -->
  <main id="escenario">

    <!-- Escena 1: el espacio -->
    <section id="espacio" class="capa activa">
      <button class="planeta" id="p-tierra" data-ir="tierra">
        <img src="img/tierra.webp" alt=""><span>La Tierra</span>
      </button>
      <button class="planeta" id="p-luna" data-ir="luna">
        <img src="img/luna.webp" alt=""><span>La Luna</span>
      </button>
      <button class="planeta" id="p-marte" data-ir="marte">
        <img src="img/marte.webp" alt=""><span>Marte</span>
      </button>
      <img id="cohete" src="img/cohete-recto.webp" alt="Tu cohete">
      <div id="globo"></div>
    </section>

    <!-- Escena 2: un mundo (Luna o Marte) con sus modelos 3D -->
    <section id="mundo" class="capa">
      <div id="fondo-mundo"></div>
      <div id="visor">
        <canvas id="lienzo"></canvas>
        <div id="etiquetas"></div>
        <div id="cargando" hidden><div class="aro"></div><span id="cargando-txt">Cargando naves…</span></div>
        <button id="btn-volver" class="boton-nav">⬅ Volver</button>
        <h1 id="nombre-mundo"></h1>
        <div id="pista" hidden>Toca una nave para explorarla</div>
        <div id="controles" hidden>
          <label for="desarmar">🔧 Armar</label>
          <input id="desarmar" type="range" min="0" max="100" value="0" aria-label="Desarmar el modelo">
          <span>Desarmar</span>
          <button id="btn-girar" class="chip" aria-pressed="true">🔄 Giro</button>
        </div>
      </div>

      <!-- Panel de información de la estación -->
      <aside id="panel" hidden>
        <div id="vineta" hidden>
          <small>Pieza</small>
          <strong id="vineta-nombre"></strong>
          <p id="vineta-para"></p>
        </div>
        <div class="ficha">
          <span class="anio" id="f-anio"></span>
          <h2 id="f-nombre"></h2>
          <p class="resumen" id="f-resumen"></p>
          <p id="f-texto"></p>
          <ul id="f-datos"></ul>
          <h3>Piezas para descubrir <span id="f-conteo"></span></h3>
          <div id="f-piezas" class="chips"></div>
        </div>
      </aside>
    </section>

    <div id="aviso"></div>
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
